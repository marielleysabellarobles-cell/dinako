<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart PTA Attendance</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#eef2f7;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.card{
  background:white;
  padding:16px;
  margin:10px;
  border-radius:12px;
  width:100%;
  max-width:420px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}
.hidden{display:none}
button,input,select,textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
}
video{width:100%;border-radius:10px}
img{max-width:100%;border-radius:8px;margin-top:5px}
</style>
</head>

<body>

<div class="card" id="loginCard">
<h2>Login</h2>
<select id="role">
  <option value="teacher">Teacher</option>
  <option value="parent">Parent</option>
</select>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="card hidden" id="teacherDash">
<h2>Teacher Dashboard</h2>
<button onclick="show('createMeeting')">Create Meeting</button>
<button onclick="show('qrPage')">Generate QR</button>
<button onclick="show('scanTeacher');startCam('teacher')">Scan QR</button>
<button onclick="show('teacherAnalytics');renderTeacherAnalytics()">Attendance Analytics</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card hidden" id="parentDash">
<h2>Parent Dashboard</h2>
<button onclick="show('agendaPage');renderAgendas()">View Agendas</button>
<button onclick="show('scanParent');startCam('parent')">Scan QR</button>
<button onclick="show('parentAnalytics');renderParentAnalytics()">My Attendance</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card hidden" id="createMeeting">
<h3>Create Meeting</h3>
<input id="mtitle" placeholder="Meeting Title">
<input id="mdate" type="date">
<textarea id="magenda" placeholder="Agenda"></textarea>
<button onclick="saveMeeting()">Save</button>
</div>

<div class="card hidden" id="qrPage">
<h3>Generate QR</h3>
<select id="qrMeetingSelect"></select>
<input id="qrParentName" placeholder="Enter parent name">
<button onclick="generateQR()">Generate QR</button>
<div id="qrcodeContainer"></div>

<div class="card hidden" id="scanTeacher">
<h3>Scan QR</h3>
<video id="camTeacher" autoplay></video>
</div>

<div class="card hidden" id="scanParent">
<h3>Scan QR</h3>
<video id="camParent" autoplay></video>
<h4>Upload MOV (Photo Proof)</h4>
<input type="file" accept="image/*" capture="environment" onchange="uploadMOV(event)">
<p id="movStatus"></p>
</div>

<div class="card hidden" id="agendaPage">
<h3>Meeting Agendas</h3>
<ul id="agendaList"></ul>
</div>

<div class="card hidden" id="teacherAnalytics">
<h3>Attendance Analytics</h3>
<ul id="teacherStats"></ul>
</div>

<div class="card hidden" id="parentAnalytics">
<h3>My Attendance</h3>
<ul id="parentStats"></ul>
</div>

<script>
const teachers=[{username:"teacher1",password:"1234"}];
const parents=[{username:"Juan",password:"parent"}];

let meetings=JSON.parse(localStorage.getItem("meetings")||"[]");
let attendance=JSON.parse(localStorage.getItem("attendance")||"[]");
let currentUser=null,currentRole=null;
let teacherStream,parentStream;

function login(){
 const r=role.value,u=username.value,p=password.value;
 const list=r==="teacher"?teachers:parents;
 if(!list.find(x=>x.username===u && x.password===p)) return alert("Invalid login");
 currentUser=u; currentRole=r;
 loginCard.classList.add("hidden");
 document.getElementById(r+"Dash").classList.remove("hidden");
 loadLists();
}

function show(id){
 document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function logout(){location.reload()}

function saveMeeting(){
 meetings.push({id:Date.now(),title:mtitle.value,date:mdate.value,agenda:magenda.value});
 localStorage.setItem("meetings",JSON.stringify(meetings));
 alert("Meeting saved");
}

function loadLists(){
 meetingSelect.innerHTML="";
 meetings.forEach(m=>meetingSelect.innerHTML+=`<option value="${m.id}">${m.title}</option>`);
 parentSelect.innerHTML="";
 parents.forEach(p=>parentSelect.innerHTML+=`<option>${p.username}</option>`);
}

function generateQR() {
  const meetingId = document.getElementById("qrMeetingSelect").value;
  const parentName = document.getElementById("qrParentName").value.trim();
  if (!parentName) return alert("Enter parent name");
  document.getElementById("qrcodeContainer").innerHTML = "";
  new QRCode(document.getElementById("qrcodeContainer"), `${meetingId}|${parentName}`);
  alert(`QR generated for ${parentName}`);
}

async function startCam(role){
 const video = role==="teacher"?camTeacher:camParent;
 const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
 video.srcObject=stream;
 if(role==="teacher") teacherStream=stream; else parentStream=stream;
 scanQR(video);
}

function scanQR(video){
 const canvas=document.createElement("canvas");
 const ctx=canvas.getContext("2d");
 const interval=setInterval(()=>{
  if(video.readyState!==4) return;
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);
  const img=ctx.getImageData(0,0,canvas.width,canvas.height);
  const code=jsQR(img.data,canvas.width,canvas.height);
  if(code){
    const [m,p]=code.data.split("|");
    attendance.push({
      meeting:m,
      parent:p,
      time:new Date().toLocaleString(),
      proof:null
    });
    localStorage.setItem("attendance",JSON.stringify(attendance));
    alert("Attendance recorded");
    clearInterval(interval);
  }
 },1200);
}

function uploadMOV(e){
 const file=e.target.files[0];
 if(!file){return}
 const reader=new FileReader();
 reader.onload=function(){
   if(attendance.length===0){alert("Scan QR first");return}
   attendance[attendance.length-1].proof=reader.result;
   localStorage.setItem("attendance",JSON.stringify(attendance));
   movStatus.textContent="✅ MOV uploaded";
 }
 reader.readAsDataURL(file);
}

function renderAgendas(){
 agendaList.innerHTML="";
 meetings.forEach(m=>{
  agendaList.innerHTML+=`<li><b>${m.title}</b> – ${m.agenda}</li>`;
 });
}

function renderTeacherAnalytics(){
 teacherStats.innerHTML="";
 parents.forEach(p=>{
  const rec=attendance.filter(a=>a.parent===p.username);
  teacherStats.innerHTML+=`<li><b>${p.username}</b>: ${rec.length} meetings</li>`;
 });
}

function renderParentAnalytics(){
 parentStats.innerHTML="";
 attendance.filter(a=>a.parent===currentUser).forEach(a=>{
  parentStats.innerHTML+=`<li>${a.time}<br>${a.proof?'<img src="'+a.proof+'">':'No MOV'}</li>`;
 });
}
</script>
</body>
</html>
